<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#163a32"><title>Atlas · Tasks</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#20352f;background:#f5f5ef}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:40px 20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:36px;margin:0}p{line-height:1.5;color:#5c6b62}h2{font-size:18px}button,input{font:inherit}button{cursor:pointer;border:1px solid #c8d2ca;border-radius:9px;background:white;color:#20352f;padding:11px 15px;min-height:44px}button:hover{background:#e9eee8}button:disabled{opacity:.55;cursor:wait}input{width:100%;padding:14px;border:1px solid #b5c2b8;border-radius:10px;background:white;min-width:0}input:focus,button:focus-visible{outline:3px solid #83b9a1;outline-offset:2px}.capture{display:flex;gap:8px;margin:24px 0}.primary{background:#163a32;color:white;border-color:#163a32}.primary:hover{background:#28564a}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs [aria-pressed=true]{background:#dde8dd;border-color:#779986}.task{background:white;border:1px solid #d9e0d7;border-radius:12px;padding:16px;margin:12px 0}.title{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;margin:0 0 6px}.done .title{text-decoration:line-through;color:#647168}.meta{font-size:12px;color:#6c786e}.actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.actions button{font-size:14px}.danger{color:#a52b2b}.edit{display:flex;gap:6px;flex-wrap:wrap}.edit input{flex-basis:100%}#message{min-height:24px;line-height:1.5}#message.error{color:#a52b2b}.empty{padding:40px 15px;text-align:center;border:1px dashed #bdc9be;border-radius:12px}details{margin-top:32px;border-top:1px solid #d4ded3;padding-top:20px}summary{cursor:pointer;padding:8px 0}li{padding:8px 0;font-size:14px}footer{font-size:12px;margin-top:30px;color:#6c786e}@media(max-width:480px){main{padding:24px 16px}.capture{flex-wrap:wrap}.capture button{width:100%}h1{font-size:30px}}
</style></head><body><main>
<header><h1>Atlas<span style="color:#72927c">.</span></h1><button id="refresh">Refresh</button></header>
<p>A little less to hold in your head.<br>Capture a task, then come back when you're ready.</p>
<form id="capture" class="capture"><input id="title" aria-label="New task" placeholder="What do you need to do?" required maxlength="500" autocomplete="off"><button class="primary">Add task</button></form>
<div id="message" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="Task filters"><button data-filter="open" aria-pressed="true">Open</button><button data-filter="completed" aria-pressed="false">Completed</button><button data-filter="all" aria-pressed="false">All tasks</button></nav>
<section id="tasks" aria-label="Tasks" aria-busy="true"><p>Loading tasks…</p></section>
<details><summary>Activity history</summary><ul id="activity"></ul></details>
<footer>Tasks are saved on this Atlas server. Browser refreshes and server restarts keep your saved tasks.</footer>
</main><script src="/app.js" defer></script></body></html>
